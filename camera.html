<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presence Detector - Marc Lou Style</title>
    <!-- 引入 TensorFlow.js 和 BlazeFace 模型 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; }
        .mirror { transform: scaleX(-1); }
        .glass { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white p-4">

    <!-- 顶部标题 -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-800 tracking-tight mb-2">摄像头探测器 <span class="text-yellow-400">v1.1</span></h1>
        <p class="text-gray-400">100% 本地运行 • 保护隐私 • 毫秒级检测</p>
    </div>

    <!-- 主容器 -->
    <div class="relative group">
        <!-- 视频主体 -->
        <div class="relative rounded-3xl overflow-hidden border-4 border-zinc-800 shadow-2xl">
            <video id="video" autoplay muted playsinline class="mirror w-[640px] h-[480px] object-cover bg-zinc-900"></video>
            
            <!-- 覆盖调试层 (Debug Panel) -->
            <div id="debugPanel" class="absolute top-4 right-4 glass p-4 rounded-2xl w-48 transition-all duration-300 opacity-0">
                <div class="flex items-center gap-3 mb-3">
                    <div id="statusDot" class="w-3 h-3 rounded-full bg-zinc-500"></div>
                    <span id="statusLabel" class="font-semibold text-sm uppercase tracking-wider text-zinc-400">初始化中</span>
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">置信度</p>
                    <p id="confidenceText" class="text-xl font-mono">0.0%</p>
                </div>
                <div class="mt-3 pt-3 border-t border-white/10">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">最后探测时间</p>
                    <p id="lastSeenText" class="text-xs text-zinc-300 italic">尚未探测</p>
                </div>
                <div class="mt-3 pt-3 border-t border-white/10">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">提醒倒计时</p>
                    <p id="countdownText" class="text-2xl font-mono text-yellow-400">--</p>
                </div>
            </div>

            <!-- 加载状态遮罩 -->
            <div id="loader" class="absolute inset-0 flex items-center justify-center bg-black/80 z-10">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-white mx-auto mb-4"></div>
                    <p id="loaderText" class="text-sm text-zinc-400">正在下载 AI 模型...</p>
                </div>
            </div>
        </div>

        <!-- 装饰背景 -->
        <div class="absolute -inset-1 bg-gradient-to-r from-yellow-500 to-orange-500 rounded-3xl blur opacity-10 group-hover:opacity-20 transition duration-1000"></div>
    </div>

    <!-- 底部操作区 -->
    <div class="mt-10 flex gap-4">
        <button id="startBtn" class="bg-white text-black px-8 py-3 rounded-xl font-bold hover:scale-105 active:scale-95 transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
            激活摄像头检测
        </button>
    </div>

    <div class="mt-8 text-zinc-600 text-sm">
        提示：请确保环境光线充足
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const debugPanel = document.getElementById('debugPanel');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const confidenceText = document.getElementById('confidenceText');
        const lastSeenText = document.getElementById('lastSeenText');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');

        let model = null;
        let isDetecting = false;
        let lastSeenTimestamp = null;
        let absenceCounter = 0; // 用于防抖的计数器
        const ABSENCE_THRESHOLD = 5; // 连续 5 帧检测不到才判定为离开

        // 久坐提醒：人脸持续在场计时
        let faceFirstSeenTime = null; // 人脸首次出现的时间戳
        const PRESENCE_ALERT_MS = 10 * 1000; // 10 秒
        let alertPlayed = false; // 防止重复播放

        const alertAudio = new Audio('https://ting9.yymp3.com/new11/liuruoying11/8.mp3');
        const countdownText = document.getElementById('countdownText');

        // 每秒刷新倒计时显示
        setInterval(() => {
            if (faceFirstSeenTime === null) {
                countdownText.innerText = '--';
                countdownText.className = 'text-2xl font-mono text-yellow-400';
                return;
            }
            const elapsed = Date.now() - faceFirstSeenTime;
            const remaining = Math.max(0, PRESENCE_ALERT_MS - elapsed);
            const secs = Math.ceil(remaining / 1000);
            if (remaining > 0) {
                countdownText.innerText = secs + 's';
                countdownText.className = secs <= 3
                    ? 'text-2xl font-mono text-red-400'
                    : 'text-2xl font-mono text-yellow-400';
            } else {
                countdownText.innerText = '🎵';
                countdownText.className = 'text-2xl font-mono text-green-400';
            }
        }, 200);

        // 初始化模型
        async function initModel() {
            try {
                // 等待 TFJS 准备好
                await tf.ready();
                model = await blazeface.load();
                loader.style.display = 'none';
                console.log("Model loaded.");
            } catch (error) {
                console.error(error);
                loaderText.innerText = "模型加载失败，请刷新页面";
            }
        }

        // 开启摄像头
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: "user" },
                    audio: false
                });
                
                video.srcObject = stream;
                
                // [关键修复]：确保视频元数据加载完毕，且视频真正开始播放后再启动检测
                // 这样可以避免 "Requested texture size [0x0] is invalid" 报错
                video.onloadeddata = () => {
                    isDetecting = true;
                    debugPanel.classList.remove('opacity-0');
                    startBtn.innerText = "正在实时探测...";
                    startBtn.disabled = true;
                    detectFrame();
                };

            } catch (err) {
                alert("无法访问摄像头: " + err.message);
            }
        }

        // 核心检测循环
        async function detectFrame() {
            if (!isDetecting) return;

            // [关键修复]：防御性检查，如果视频宽高仍为 0 或视频还没准备好，跳过这一帧
            if (video.readyState < 2 || video.videoWidth === 0) {
                requestAnimationFrame(detectFrame);
                return;
            }

            try {
                // 进行预测
                const predictions = await model.estimateFaces(video, false);

                if (predictions.length > 0) {
                    // 1. 判定：有人
                    absenceCounter = 0;

                    const confidence = (predictions[0].probability[0] * 100).toFixed(1);

                    updateUI(true, confidence);
                    lastSeenTimestamp = new Date().toLocaleTimeString();
                    lastSeenText.innerText = lastSeenTimestamp;

                    // 记录人脸首次出现时间
                    if (faceFirstSeenTime === null) {
                        faceFirstSeenTime = Date.now();
                        alertPlayed = false;
                    }

                    // 持续在场超过阈值，播放音乐（只播一次）
                    const presenceDuration = Date.now() - faceFirstSeenTime;
                    if (presenceDuration >= PRESENCE_ALERT_MS && !alertPlayed) {
                        alertPlayed = true;
                        alertAudio.currentTime = 0;
                        alertAudio.play().catch(e => console.warn('音频播放失败:', e));
                    }
                } else {
                    // 2. 判定：可能无人
                    absenceCounter++;

                    if (absenceCounter >= ABSENCE_THRESHOLD) {
                        updateUI(false, "0.0");
                        // 人离开后重置计时，下次回来重新计
                        faceFirstSeenTime = null;
                        alertPlayed = false;
                        alertAudio.pause();
                        alertAudio.currentTime = 0;
                    }
                }
            } catch (error) {
                console.warn("探测帧时出错 (通常是由于视频流波动):", error);
            }

            requestAnimationFrame(detectFrame);
        }

        // 更新 UI 状态
        function updateUI(isPresent, confidence) {
            if (isPresent) {
                statusDot.className = "w-3 h-3 rounded-full bg-green-500 glow-green";
                statusLabel.innerText = "有人在电脑前";
                statusLabel.classList.remove('text-red-500', 'text-zinc-400');
                statusLabel.classList.add('text-green-500');
                confidenceText.innerText = confidence + "%";
            } else {
                statusDot.className = "w-3 h-3 rounded-full bg-red-500 glow-red";
                statusLabel.innerText = "位置空缺";
                statusLabel.classList.remove('text-green-500', 'text-zinc-400');
                statusLabel.classList.add('text-red-500');
                confidenceText.innerText = "0.0%";
            }
        }

        // 事件监听
        startBtn.addEventListener('click', startCamera);

        // 自动初始化
        window.onload = initModel;
    </script>
</body>
</html>
