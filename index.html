<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防久坐提醒</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-green-400 p-5 font-mono">

    <h1 class="text-xl mb-4 text-white border-b border-green-800 pb-2">防久坐提醒</h1>

    <!-- 调试框：活动量 + 错误信息 -->
    <div class="mb-4">
        <div class="flex justify-between text-xs mb-1">
            <span class="text-green-600 uppercase">活动量 (Magnitude)</span>
            <span id="magnitude-value" class="text-yellow-400 font-bold">—</span>
        </div>
        <div id="debug-box" class="bg-black p-3 border border-green-900 h-32 overflow-y-auto text-xs">
            <div class="text-gray-500">[SYSTEM] 等待启动...</div>
        </div>
    </div>

    <!-- 设置 -->
    <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs uppercase mb-1">久坐提醒时间（分钟）</label>
            <input type="number" id="limit" value="45" min="1"
                class="bg-gray-800 border border-green-900 w-full p-2 text-white">
        </div>
        <div>
            <label class="block text-xs uppercase mb-1">灵敏度（阈值）</label>
            <input type="number" id="sens" value="1.5" step="0.1" min="0.1"
                class="bg-gray-800 border border-green-900 w-full p-2 text-white">
        </div>
    </div>

    <!-- 倒计时进度条 -->
    <div class="mb-4">
        <div class="flex justify-between text-xs mb-1">
            <span id="status-label" class="text-green-400">静止倒计时中</span>
            <span id="timer-label">--:--</span>
        </div>
        <div class="w-full bg-gray-800 h-5 rounded">
            <div id="progress" class="bg-green-500 h-5 rounded transition-all duration-500" style="width: 100%"></div>
        </div>
    </div>

    <!-- 活动验证进度条 -->
    <div class="mb-4">
        <div class="flex justify-between text-xs mb-1">
            <span class="text-green-600 uppercase">活动验证</span>
            <span id="activity-label" class="text-gray-500">等待活动...</span>
        </div>
        <div class="w-full bg-gray-800 h-3 rounded overflow-hidden">
            <div id="activity-bar" class="bg-blue-500 h-3 rounded transition-all duration-200" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-xs mt-1 text-gray-600">
            <span>持续时间 <span id="act-duration">0</span>s / 10s</span>
            <span>峰值次数 <span id="act-peaks">0</span> / 15</span>
        </div>
    </div>

    <!-- 今日有效活动总量 -->
    <div class="mb-6 border border-green-900 rounded p-3 bg-gray-800 bg-opacity-40">
        <div class="flex justify-between text-xs mb-1">
            <span class="text-green-600 uppercase">今日有效活动</span>
            <span class="text-gray-500 text-xs">目标
                <input type="number" id="daily-goal" value="8" min="1" max="50"
                    class="bg-transparent border-b border-green-800 w-8 text-center text-white focus:outline-none">
                次
            </span>
        </div>
        <div class="w-full bg-gray-700 h-4 rounded overflow-hidden">
            <div id="total-bar" class="bg-emerald-500 h-4 rounded transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-xs mt-1 text-gray-500">
            <span>已完成 <span id="total-count" class="text-white font-bold">0</span> 次</span>
            <span>累计活动 <span id="total-time" class="text-white font-bold">0</span> 分钟</span>
        </div>
    </div>

    <!-- 开始按钮 -->
    <button id="startBtn"
        class="w-full bg-green-600 text-black font-bold py-4 rounded hover:bg-green-400 active:scale-95 transition-all">
        开始（授权传感器 + 音频）
    </button>

    <!-- 测试系统通知 -->
    <button id="testNotifyBtn"
        class="w-full mt-3 bg-gray-700 text-green-400 font-bold py-3 rounded border border-green-800 hover:bg-gray-600 active:scale-95 transition-all text-sm">
        🔔 测试系统通知
    </button>
    <div id="notify-status" class="text-xs text-gray-500 mt-1 text-center"></div>

    <!-- 静音音频，保持后台运行 -->
    <audio id="silentAudio" loop>
        <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3" type="audio/mp3">
    </audio>

    <!-- 久坐提醒音频 -->
    <audio id="alertAudio">
        <source src="https://ting9.yymp3.com/new11/liuruoying11/8.mp3" type="audio/mp3">
    </audio>

    <script>
        let lastMoveTime = Date.now();
        let isRunning = false;
        let alerted = false;
        let lastLogMove = 0;

        // ── 活动验证状态 ──────────────────────────────────────
        const REQUIRED_DURATION = 10000; // 持续活动 10 秒
        const REQUIRED_PEAKS    = 15;    // 期间峰值次数
        const PEAK_MIN_INTERVAL = 350;   // 两次峰值最小间隔 ms

        let activityStartTime = 0;   // 本轮活动开始时间
        let peakCount         = 0;   // 本轮峰值计数
        let lastPeakTime      = 0;   // 上次峰值时间
        let inActivity        = false; // 当前是否处于活动窗口

        const debugBox    = document.getElementById('debug-box');
        const progress    = document.getElementById('progress');
        const timerLabel  = document.getElementById('timer-label');
        const statusLabel = document.getElementById('status-label');
        const magValue    = document.getElementById('magnitude-value');
        const audio       = document.getElementById('silentAudio');
        const alertAudio  = document.getElementById('alertAudio');
        const activityBar = document.getElementById('activity-bar');
        const actLabel    = document.getElementById('activity-label');
        const actDuration = document.getElementById('act-duration');
        const actPeaks    = document.getElementById('act-peaks');
        const totalBar    = document.getElementById('total-bar');
        const totalCount  = document.getElementById('total-count');
        const totalTime   = document.getElementById('total-time');

        // ── 今日有效活动累计 ──────────────────────────────────
        let dailySessionCount   = 0;   // 验证通过次数
        let dailyActiveMs       = 0;   // 累计有效活动毫秒数

        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (isError) div.className = 'text-red-400';
            debugBox.prepend(div);
        }

        // ── 测试系统通知 ──────────────────────────────────────
        document.getElementById('testNotifyBtn').onclick = async () => {
            const statusEl = document.getElementById('notify-status');

            if (!('Notification' in window)) {
                statusEl.textContent = '❌ 当前浏览器不支持系统通知';
                statusEl.className = 'text-xs text-red-400 mt-1 text-center';
                return;
            }

            let perm = Notification.permission;
            if (perm === 'default') {
                perm = await Notification.requestPermission();
            }

            if (perm === 'denied') {
                statusEl.textContent = '❌ 通知权限被拒绝，请在浏览器设置中手动开启';
                statusEl.className = 'text-xs text-red-400 mt-1 text-center';
                return;
            }

            new Notification('久坐提醒 🚶', {
                body: '该起来走一走了！这是一条测试通知。',
                icon: 'https://cdn.jsdelivr.net/npm/twemoji@14/assets/72x72/1f9e0.png',
            });

            statusEl.textContent = '✅ 通知已发送，检查你的系统通知栏';
            statusEl.className = 'text-xs text-green-400 mt-1 text-center';
        };

        // ── 开始按钮 ──────────────────────────────────────────
        document.getElementById('startBtn').onclick = async () => {
            try {
                await audio.play();

                if (typeof DeviceMotionEvent !== 'undefined' &&
                    typeof DeviceMotionEvent.requestPermission === 'function') {
                    const perm = await DeviceMotionEvent.requestPermission();
                    if (perm !== 'granted') throw new Error('传感器权限被拒绝');
                }

                if (typeof DeviceMotionEvent === 'undefined') {
                    log('⚠️ 当前设备/浏览器不支持 DeviceMotion（需手机）', true);
                } else {
                    log('✅ 传感器已启动，开始监测...');
                }

                isRunning = true;
                alerted = false;
                lastMoveTime = Date.now();

                document.getElementById('startBtn').disabled = true;
                document.getElementById('startBtn').textContent = '运行中...';
                document.getElementById('startBtn').classList.replace('bg-green-600', 'bg-gray-600');

                window.addEventListener('devicemotion', handleMotion);
                requestAnimationFrame(updateLoop);
            } catch (e) {
                log(e.message, true);
            }
        };

        // ── 传感器处理 ────────────────────────────────────────
        function handleMotion(event) {
            let acc = event.acceleration;
            let withGravity = false;

            if (!acc || acc.x === null) {
                acc = event.accelerationIncludingGravity;
                withGravity = true;
            }
            if (!acc) return;

            const magnitude = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);
            magValue.innerText = magnitude.toFixed(3) + (withGravity ? ' (含重力)' : '');

            const threshold = parseFloat(document.getElementById('sens').value);
            const now = Date.now();

            if (magnitude > threshold) {
                // ── 峰值检测（限制最小间隔，避免同一次抖动重复计数）
                if (now - lastPeakTime > PEAK_MIN_INTERVAL) {
                    lastPeakTime = now;

                    if (!inActivity) {
                        // 开启新一轮活动窗口
                        inActivity = true;
                        activityStartTime = now;
                        peakCount = 1;
                        log('活动开始，开始验证...');
                    } else {
                        peakCount++;
                    }
                }

                // 限制日志频率
                if (now - lastLogMove > 3000) {
                    log(`活动中 magnitude=${magnitude.toFixed(2)} peaks=${peakCount}`);
                    lastLogMove = now;
                }
            } else if (inActivity) {
                // 超过 2 秒没有峰值，视为活动中断，重置本轮
                if (now - lastPeakTime > 2000) {
                    resetActivityWindow();
                }
            }

            // ── 判断是否满足验证条件
            if (inActivity) {
                const duration = now - activityStartTime;
                const durationOk = duration >= REQUIRED_DURATION;
                const peaksOk    = peakCount >= REQUIRED_PEAKS;

                if (durationOk && peaksOk) {
                    // 验证通过！重置久坐计时
                    lastMoveTime = now;
                    alerted = false;
                    
                    // 累计今日活动量
                    dailySessionCount++;
                    dailyActiveMs += duration;
                    
                    log(`✅ 活动验证通过！持续 ${(duration/1000).toFixed(1)}s，峰值 ${peakCount} 次 | 今日第 ${dailySessionCount} 次`);
                    resetActivityWindow();
                }
            }
        }

        function resetActivityWindow() {
            inActivity = false;
            activityStartTime = 0;
            peakCount = 0;
        }

        // ── 倒计时循环 ────────────────────────────────────────
        function updateLoop() {
            if (!isRunning) return;

            const limitMs   = parseFloat(document.getElementById('limit').value) * 60 * 1000;
            const elapsed   = Date.now() - lastMoveTime;
            const remaining = Math.max(0, limitMs - elapsed);
            const percent   = (remaining / limitMs) * 100;

            // 久坐进度条
            progress.style.width = `${percent}%`;
            if (percent > 50) {
                progress.className = 'bg-green-500 h-5 rounded transition-all duration-500';
            } else if (percent > 20) {
                progress.className = 'bg-yellow-400 h-5 rounded transition-all duration-500';
            } else {
                progress.className = 'bg-red-500 h-5 rounded transition-all duration-500';
            }

            // 时间显示
            const secs = Math.ceil(remaining / 1000);
            timerLabel.innerText = `${Math.floor(secs / 60).toString().padStart(2,'0')}:${(secs % 60).toString().padStart(2,'0')}`;

            // 状态文字
            if (elapsed < 3000) {
                statusLabel.textContent = '✅ 活动验证通过，倒计时已重置';
                statusLabel.className = 'text-green-400';
            } else if (remaining > 0) {
                statusLabel.textContent = '静止倒计时中...';
                statusLabel.className = 'text-yellow-400';
            }

            // ── 活动验证进度条 ────────────────────────────────
            if (inActivity) {
                const duration    = Date.now() - activityStartTime;
                const durPercent  = Math.min((duration / REQUIRED_DURATION) * 100, 100);
                const peakPercent = Math.min((peakCount / REQUIRED_PEAKS) * 100, 100);
                // 取两者中较低的作为整体进度（两个条件都要满足）
                const actPercent  = Math.min(durPercent, peakPercent);

                activityBar.style.width = `${actPercent}%`;
                activityBar.className = actPercent >= 100
                    ? 'bg-green-400 h-3 rounded transition-all duration-200'
                    : 'bg-blue-500 h-3 rounded transition-all duration-200';

                actDuration.textContent = (duration / 1000).toFixed(1);
                actPeaks.textContent    = peakCount;
                actLabel.textContent    = '验证中...';
                actLabel.className      = 'text-blue-400';
            } else {
                // 没有活动时，进度条缓慢归零
                const curWidth = parseFloat(activityBar.style.width) || 0;
                if (curWidth > 0) {
                    activityBar.style.width = `${Math.max(0, curWidth - 2)}%`;
                }
                actDuration.textContent = '0';
                actPeaks.textContent    = '0';
                actLabel.textContent    = elapsed < 3000 ? '✅ 验证通过' : '等待活动...';
                actLabel.className      = elapsed < 3000 ? 'text-green-400' : 'text-gray-500';
            }

            // ── 今日有效活动总量进度条 ────────────────────────
            const dailyGoal     = Math.max(1, parseInt(document.getElementById('daily-goal').value) || 8);
            const totalPercent  = Math.min((dailySessionCount / dailyGoal) * 100, 100);
            totalBar.style.width = `${totalPercent}%`;
            totalBar.className = totalPercent >= 100
                ? 'bg-yellow-400 h-4 rounded transition-all duration-500'
                : 'bg-emerald-500 h-4 rounded transition-all duration-500';
            totalCount.textContent = `${dailySessionCount} / ${dailyGoal}`;
            totalTime.textContent  = (dailyActiveMs / 60000).toFixed(1);

            // 归零提醒（只触发一次，直到下次活动）
            if (remaining <= 0 && !alerted) {
                alerted = true;
                statusLabel.textContent = '⚠️ 该起来动一动了！';
                statusLabel.className = 'text-red-400';
                log('⚠️ 久坐提醒：该起来活动了！', true);
                alertAudio.currentTime = 0;
                alertAudio.play().catch(e => log('音频播放失败: ' + e.message, true));
                if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
            }

            requestAnimationFrame(updateLoop);
        }
    </script>
</body>
</html>
