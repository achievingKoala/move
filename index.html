<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Sedentary Hack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-green-400 p-5 font-mono">

    <h1 class="text-xl mb-4 text-white border-b border-green-800 pb-2 shadow-sm">LEVELS_MODE: ANTI-SEDENTARY v1.0</h1>

    <div id="debug-box" class="bg-black p-3 border border-green-900 h-40 overflow-y-auto text-xs mb-4 shadow-inner">
        <div>[SYSTEM] Waiting for start...</div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs uppercase">Reminder (Min)</label>
            <input type="number" id="limit" value="45" class="bg-gray-800 border border-green-900 w-full p-2">
        </div>
        <div>
            <label class="block text-xs uppercase">Sensitivity</label>
            <input type="number" id="sens" value="12" class="bg-gray-800 border border-green-900 w-full p-2">
        </div>
    </div>

    <div class="mb-6">
        <div class="flex justify-between text-xs mb-1">
            <span>STILLNESS COUNTDOWN</span>
            <span id="timer-label">00:00</span>
        </div>
        <div class="w-full bg-gray-800 h-4">
            <div id="progress" class="bg-green-500 h-4 transition-all duration-1000" style="width: 100%"></div>
        </div>
    </div>

    <button id="startBtn" class="w-full bg-green-600 text-black font-bold py-4 hover:bg-green-400 shadow-lg active:transform active:scale-95 transition-all">
        START SESSION (ENABLE AUDIO)
    </button>

    <audio id="silentAudio" loop>
        <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3" type="audio/mp3">
    </audio>

    <script>
        let lastMoveTime = Date.now();
        let isRunning = false;
        const debugBox = document.getElementById('debug-box');
        const progress = document.getElementById('progress');
        const audio = document.getElementById('silentAudio');

        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (isError) div.className = 'text-red-500';
            debugBox.prepend(div);
        }

        document.getElementById('startBtn').onclick = async () => {
            try {
                // 必须在点击事件中触发音频和权限
                await audio.play();
                
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') throw new Error('Permission denied');
                }

                isRunning = true;
                lastMoveTime = Date.now();
                log("Session Started. Audio playing in background.");
                
                window.addEventListener('devicemotion', handleMotion);
                updateLoop();
            } catch (e) {
                log(e.message, true);
            }
        };

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;
            
            const magnitude = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
            const threshold = parseFloat(document.getElementById('sens').value);

            // 如果活动量超过阈值，重置时间
            if (magnitude > threshold) {
                lastMoveTime = Date.now();
                // log(`Moving: ${magnitude.toFixed(2)}`);
            }
        }

        function updateLoop() {
            if (!isRunning) return;

            const limitMs = parseFloat(document.getElementById('limit').value) * 60 * 1000;
            const elapsed = Date.now() - lastMoveTime;
            const remaining = Math.max(0, limitMs - elapsed);
            
            const percent = (remaining / limitMs) * 100;
            progress.style.width = `${percent}%`;
            
            const secs = Math.ceil(remaining / 1000);
            document.getElementById('timer-label').innerText = `${Math.floor(secs/60)}:${(secs%60).toString().padStart(2, '0')}`;

            if (remaining <= 0) {
                log("!!! TIME TO STAND UP !!!", true);
                // 震动提醒（如果设备支持）
                if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
                // 这里可以播放一个报警音
            }

            requestAnimationFrame(updateLoop);
        }
    </script>
</body>
</html>
